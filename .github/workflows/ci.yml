name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: docker compose config
        run: docker compose -f .devcontainer/docker-compose.yml config

      - name: JSON devcontainer
        run: python -m json.tool .devcontainer/devcontainer.json > /dev/null

      - name: JSON create-wagtail-config
        run: |
          python -m json.tool .devcontainer/create-wagtail-config.json > /dev/null
          python -m json.tool .devcontainer/create-wagtail-config.schema.json > /dev/null
